<svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <rect width="600" height="320" fill="#000000"/>
  <!-- Autocorrelation ACF stems -->
  <line x1="40" y1="160" x2="560" y2="160" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <!-- Bartlett bounds -->
  <line x1="40" y1="110" x2="560" y2="110" stroke="rgba(255,255,255,0.25)" stroke-dasharray="3,3"/>
  <line x1="40" y1="210" x2="560" y2="210" stroke="rgba(255,255,255,0.25)" stroke-dasharray="3,3"/>
  <text x="565" y="114" fill="rgba(255,255,255,0.4)" font-family="JetBrains Mono, monospace" font-size="9">+1.96/√N</text>
  <text x="565" y="214" fill="rgba(255,255,255,0.4)" font-family="JetBrains Mono, monospace" font-size="9">-1.96/√N</text>

  <!-- Stems: lag 0 = 1.0 -->
  <line x1="70" y1="160" x2="70" y2="60" stroke="#ffffff" stroke-width="2"/>
  <circle cx="70" cy="60" r="3" fill="#ffffff"/>

  <!-- Other lags -->
  <line x1="110" y1="160" x2="110" y2="135" stroke="rgba(255,255,255,0.8)" stroke-width="1.5"/>
  <circle cx="110" cy="135" r="2.5" fill="#ffffff"/>

  <line x1="150" y1="160" x2="150" y2="185" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  <circle cx="150" cy="185" r="2.5" fill="rgba(255,255,255,0.7)"/>

  <line x1="190" y1="160" x2="190" y2="150" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  <circle cx="190" cy="150" r="2.5" fill="rgba(255,255,255,0.7)"/>

  <line x1="230" y1="160" x2="230" y2="175" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  <circle cx="230" cy="175" r="2.5" fill="rgba(255,255,255,0.7)"/>

  <line x1="270" y1="160" x2="270" y2="140" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  <circle cx="270" cy="140" r="2.5" fill="rgba(255,255,255,0.7)"/>

  <line x1="310" y1="160" x2="310" y2="168" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <circle cx="310" cy="168" r="2" fill="rgba(255,255,255,0.5)"/>

  <line x1="350" y1="160" x2="350" y2="158" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <circle cx="350" cy="158" r="2" fill="rgba(255,255,255,0.5)"/>

  <line x1="390" y1="160" x2="390" y2="163" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <circle cx="390" cy="163" r="2" fill="rgba(255,255,255,0.5)"/>

  <line x1="430" y1="160" x2="430" y2="159" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <circle cx="430" cy="159" r="2" fill="rgba(255,255,255,0.5)"/>

  <line x1="470" y1="160" x2="470" y2="161" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <circle cx="470" cy="161" r="2" fill="rgba(255,255,255,0.5)"/>

  <text x="50" y="35" fill="rgba(255,255,255,0.6)" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1">SAMPLE ACF // ρ(k) WITH BARTLETT CONFIDENCE BOUNDS</text>
</svg>