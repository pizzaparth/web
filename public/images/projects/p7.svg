<svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <rect width="600" height="320" fill="#000000"/>
  <!-- FFT Spectrum -->
  <line x1="50" y1="270" x2="550" y2="270" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <!-- Noise floor line -->
  <line x1="50" y1="235" x2="550" y2="235" stroke="rgba(255,255,255,0.2)" stroke-dasharray="3,3"/>
  <text x="50" y="225" fill="rgba(255,255,255,0.4)" font-family="JetBrains Mono, monospace" font-size="9">-45 dB FLOOR</text>

  <!-- Spectrum path with spikes at harmonic frequencies -->
  <path d="M 50 240 
           L 70 232 L 85 238 L 95 234 L 110 236 L 120 180 L 125 70 L 130 190 L 140 235 
           L 170 237 L 195 233 L 210 235 L 220 195 L 225 110 L 230 200 L 245 236 
           L 280 238 L 310 234 L 330 237 L 340 210 L 345 155 L 350 215 L 365 235 
           L 410 238 L 440 235 L 460 237 L 490 235 L 520 238 L 550 235"
        stroke="#ffffff" stroke-width="1.8" fill="none"/>
  
  <text x="125" y="58" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">f_1 = 14.2 Hz</text>
  <line x1="125" y1="64" x2="125" y2="70" stroke="#ffffff"/>

  <text x="225" y="98" fill="rgba(255,255,255,0.8)" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">2f_1</text>
  <text x="345" y="145" fill="rgba(255,255,255,0.6)" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">3f_1</text>

  <text x="50" y="35" fill="rgba(255,255,255,0.6)" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1">SPECTRAL DENSITY // HARMONIC ORDER-FLOW ESTIMATE</text>
</svg>