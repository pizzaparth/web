<svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <rect width="600" height="320" fill="#000000"/>
  <!-- Volatility smile across maturities -->
  <line x1="50" y1="270" x2="550" y2="270" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <line x1="50" y1="50" x2="50" y2="270" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>

  <!-- T = 1M (high curvature) -->
  <path d="M 80 80 Q 280 230 520 120" stroke="#ffffff" stroke-width="2" fill="none"/>
  <text x="525" y="125" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="9">1M</text>

  <!-- T = 3M -->
  <path d="M 80 110 Q 280 220 520 150" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" fill="none"/>
  <text x="525" y="155" fill="rgba(255,255,255,0.7)" font-family="JetBrains Mono, monospace" font-size="9">3M</text>

  <!-- T = 6M -->
  <path d="M 80 140 Q 280 215 520 175" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" fill="none"/>
  <text x="525" y="180" fill="rgba(255,255,255,0.5)" font-family="JetBrains Mono, monospace" font-size="9">6M</text>

  <!-- T = 1Y (flatter) -->
  <path d="M 80 170 Q 280 210 520 195" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
  <text x="525" y="200" fill="rgba(255,255,255,0.3)" font-family="JetBrains Mono, monospace" font-size="9">1Y</text>

  <!-- ATM Line -->
  <line x1="280" y1="50" x2="280" y2="270" stroke="rgba(255,255,255,0.15)" stroke-dasharray="2,2"/>
  <text x="280" y="285" fill="rgba(255,255,255,0.5)" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">ATM (K/S = 1.0)</text>

  <text x="50" y="35" fill="rgba(255,255,255,0.6)" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1">IMPLIED VOLATILITY SMILE // σ_imp(K, T)</text>
</svg>